services:
  mysql:
    image: mysql:5.7
    container_name: mysql-sip
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: kamailio
      MYSQL_USER: kamailio_user
      MYSQL_PASSWORD: kamailio_password
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    restart: always

  kamailio:
    build: .
    container_name: kamailio-sip
    depends_on:
      - mysql
    environment:
      SIP_DOMAIN: localhost
      DBENGINE: MYSQL
      DBHOST: mysql
      DBPORT: 3306
      DBNAME: kamailio
      DBRWUSER: kamailio
      DBRWPW: kamailiorw1
      DBROUSER: kamailioro
      DBROPW: kamailioro1
      DBROOTUSER: root
      DBROOTPW: dbrootpw1
      CHARSET: utf16
    ports:
      - "5060:5060/tcp"
      - "5060:5060/udp"
    restart: always
    stdin_open: true
    tty: true

volumes:
  mysql-data:
    driver: local
